name: Daily Announcements Update

on:
  schedule:
    # 7:00 PM IST = 1:30 PM UTC
    - cron: '30 13 * * *'

  workflow_dispatch:

jobs:
  announcements:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests pyarrow fastparquet

      - name: Run announcements pipeline
        run: |
          python announcements.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/Announcements/announcements.parquet

          git diff --cached --quiet || git commit -m "daily announcements update"

          git push origin dev
