name: Weekly EPS Update

on:
  schedule:
    - cron: "30 13 * * 0"   # Sunday 7 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (dev branch)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EPS update script
        run: python fundamental_data/eps.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin dev

          git add data/

          git diff --cached --quiet || git commit -m "Weekly EPS update"

          git push origin dev
