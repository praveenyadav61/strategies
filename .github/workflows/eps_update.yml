name: Weekly EPS Update

on:
  schedule:
    - cron: "30 13 * * 0"   # Sunday 7 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (dev branch)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EPS update script
        run: python fundamental_data/eps.py

      # 🔥 DEBUG BLOCK (added)
      - name: Debug everything
        run: |
          echo "----- CURRENT DIR -----"
          pwd

          echo "----- REPO FILES -----"
          ls -R

          echo "----- DATA FOLDER -----"
          ls -R data || echo "data folder missing"

          echo "----- QUARTERLY FOLDER -----"
          ls -R data/quarterly || echo "quarterly folder missing"

          echo "----- FILE COUNT -----"
          find data -type f | wc -l || echo "no files"

          echo "----- SAMPLE FILE CONTENT -----"
          head -n 5 data/quarterly/eps_full.csv || echo "file not found"

          echo "----- GIT STATUS BEFORE ADD -----"
          git status

          git add data/

          echo "----- GIT STATUS AFTER ADD -----"
          git status

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin dev

          git add data/

          git diff --cached --quiet || git commit -m "Weekly EPS update"

          git push origin dev
