name: Weekly EPS Update

on:
  schedule:
    - cron: "30 13 * * 0"   # Sunday 7 PM IST
  workflow_dispatch:

jobs:
  update-eps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev   # ✅ always use dev branch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests lxml html5lib

      - name: Run EPS script
        run: |
          python eps.py

      - name: Commit & Push changes to dev
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/quarterly/*.csv

          git commit -m "Weekly EPS update" || echo "No changes"

          git push origin dev
