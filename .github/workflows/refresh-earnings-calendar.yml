name: Refresh earnings calendar

on:
  workflow_dispatch:
  schedule:
    # 02:15 UTC = 07:45 IST
    - cron: "15 2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-earnings-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install downloader dependencies
        run: python -m pip install pandas pyarrow requests

      - name: Download rolling calendar snapshot
        run: python scripts/download_earnings_calendar.py --days-back 15 --days-forward 45

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/static/earnings_calendar.parquet; then
            echo "Calendar snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/earnings_calendar.parquet
          git commit -m "data: refresh earnings calendar"
          git push
